name: Bug report
description: Report a reproducible problem to help us improve
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
      placeholder: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release tag.
      placeholder: e.g. v0.1.0 or 1a2b3c4
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node/Bun version, browser, deployment target (local/Vercel/Docker), etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or screenshots (redact secrets).

