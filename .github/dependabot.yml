version: 2
updates:
  # Keep GitHub Actions pinned in our workflows up to date (low noise,
  # security-relevant). Minor/patch bumps are grouped into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # npm version updates. Security fixes are already handled automatically by
  # Dependabot security updates (which still bump majors when a fix requires
  # it); this keeps the rest current. Minor/patch bumps are grouped into one
  # PR to minimise noise, and major version bumps are ignored — those tend to
  # be breaking (e.g. tailwindcss 3->4, typescript 5->6) and should be done
  # deliberately as their own migration, not auto-proposed.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
