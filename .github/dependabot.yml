version: 2
updates:
  # Keep GitHub Actions pinned in our workflows up to date (low noise,
  # security-relevant). Minor/patch bumps are grouped into a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # npm version updates. Security fixes are already handled automatically by
  # Dependabot security updates; this keeps the rest current. Minor/patch
  # bumps are grouped to minimise PR noise — remove this block if it's still
  # too noisy and rely on security updates alone.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
